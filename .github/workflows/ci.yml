name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The app builds without a database: pages render per request, so a
      # broken page or workflow is caught here rather than on deploy.
      - run: pnpm --filter @league/web exec next build
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          SESSION_SECRET: ci
          CRON_SECRET: ci
          COMMISSIONER_PASSWORD: ci
