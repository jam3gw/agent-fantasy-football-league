name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The default is six hours. This project runs unattended and CI normally
    # finishes in about eight minutes, so a run that stops making progress
    # should fail while it is still the current thing.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # `next build` alone, without the migrate and seed steps the real build
      # runs first: there is no database here. Pages are ISR-prerendered, so a
      # page that throws, or a workflow that will not compile, is caught here
      # rather than on the deploy. Every read degrades to an empty render.
      - run: pnpm --filter @league/web exec next build
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          # Nothing is listening, so fail the connect in a second rather than
          # eight — a prerender has 60 seconds and a page makes many reads.
          DB_CONNECT_TIMEOUT_SECONDS: "1"
          SESSION_SECRET: ci
          CRON_SECRET: ci
          COMMISSIONER_PASSWORD: ci
